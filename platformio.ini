; fm1buddy:
;
;   cyd-s3      the touch screen app (Freenove ESP32-S3 2.8" FNK0104B): pio run -e cyd-s3 -t upload
;   cyd-s3-4    the same on the 4" board (Freenove ESP32-S3 4" FNK0104S): pio run -e cyd-s3-4 -t upload
;   cyd-s3-35   the same on the 3.5" board (Freenove ESP32-S3 3.5" FNK0104N): pio run -e cyd-s3-35 -t upload
;   sim         the same app on the desktop (SDL2): pio run -e sim && .pio/build/sim/program
;   sim-4       the desktop app at the 4"'s (and the 3.5"'s) screen size: pio run -e sim-4 && .pio/build/sim-4/program

[platformio]
default_envs = cyd-s3

; the app (src/app), shared by the boards and the simulator
[app]
build_flags =
    -I src/app
    -D LV_CONF_INCLUDE_SIMPLE=1
; NOTE (2026-11-20): these were "symlink:///home/claude/libs/..." in the cloud workspace this was
; last built in, because its network blocks the PlatformIO registry. The versions below are the
; exact ones that were vendored there. They have NOT been resolved against the registry from here --
; check them against the platformio.ini in your own working repo, which is the authoritative one.
lib_deps =
    lvgl/lvgl@9.2.2
    bblanchon/ArduinoJson@7.2.1

; the CYD-S3 boards: the same chip (N16R8), their own pins and screens (src/s3/display.cpp, touch.cpp)
[s3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312/platform-espressif32.zip
board = esp32-s3-devkitc1-n16r8
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.partitions = default_16MB.csv
build_src_filter = +<app/> +<s3/>
build_flags =
    ${app.build_flags}
    ; crashes kept for the log (hal_s3.cpp onPanic): Arduino's panic hook is a wrapper the link has to ask for
    -Wl,--wrap=esp_panic_handler
    ; for now the USB-C port is USB serial (flashing, logs); it becomes the USB host with MIDI
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    ; Bluetooth's buffers in PSRAM: the internal RAM is for Wi-Fi and the USB host
    -D CONFIG_BT_NIMBLE_MEM_ALLOC_MODE_EXTERNAL=1
    ; the USB host: TinyUSB (src/s3/tusb_config_fm1buddy.h)
    -I src/s3
    '-D CFG_TUSB_CONFIG_FILE="tusb_config_fm1buddy.h"'
lib_deps =
    ${app.lib_deps}
    h2zero/NimBLE-Arduino@2.5.1
    ; upstream TinyUSB 0.21.0, not the Adafruit Arduino wrapper. The tag spelling here is a guess:
    ; it may need to be "v0.21.0". Check against your own repo.
    https://github.com/hathach/tinyusb.git#0.21.0

; the 2.8" and the 4": the same pins, a screen on TFT_eSPI (SPI) and the FT6336 touch panel
[s3-tft]
extends = s3
; TFT_eSPI's screen start without its fixed waits (270 ms): tools/tft_fast.py
extra_scripts = pre:tools/tft_fast.py
build_flags =
    ${s3.build_flags}
    ; the touch panel (FT6336, I2C)
    -D TOUCH_SDA=16
    -D TOUCH_SCL=15
    -D TOUCH_RST=18
    -D TOUCH_INT=17
    ; the SD card (4-bit SD_MMC)
    -D SD_CLK=38
    -D SD_CMD=40
    -D SD_D0=39
    -D SD_D1=41
    -D SD_D2=48
    -D SD_D3=47
    ; the RGB LED (WS2812), and the battery's divider (hal::batteryMv)
    -D LED_RGB=42
    -D BAT_ADC=9
    ; TFT_eSPI: the screen's pins
    -D USER_SETUP_LOADED=1
    -D USE_HSPI_PORT=1
    -D TFT_MISO=13
    -D TFT_MOSI=11
    -D TFT_SCLK=12
    -D TFT_CS=10
    -D TFT_DC=46
    -D TFT_RST=-1
    -D TFT_BL=45
    -D TFT_BACKLIGHT_ON=HIGH
    -D SPI_FREQUENCY=40000000
    -D SPI_READ_FREQUENCY=20000000
lib_deps =
    ${s3.lib_deps}
    bodmer/TFT_eSPI@2.5.43

[env:cyd-s3]
extends = s3-tft
build_flags =
    ${s3-tft.build_flags}
    '-D FM1BUDDY_BIN="fm1buddy-cyd-s3.bin"'
    ; as in Freenove's FNK0104AB setup: ILI9341, 320x240
    -D ILI9341_2_DRIVER=1
    -D TFT_RGB_ORDER=TFT_BGR
    -D TFT_INVERSION_ON=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320

; FM Buddy 2.0: the PCBfun ESP32-S3 2.8" board (LCDWIKI ES3C28P family; model photo pending, H1). Measured on the board
; with the cyd-s3 build: display, touch, SD, USB, battery ADC, 8 MB PSRAM and 16 MB flash all as cyd-s3
; (docs/FM_BUDDY_2_0_HARDWARE.md). Its own release name, so the upstream self-update never offers to replace it
; (jobs.cpp: an update is offered only for a file the installer page lists)
[env:pcbfun-s3-28]
extends = s3-tft
build_flags =
    ${s3-tft.build_flags}
    '-D FM1BUDDY_BIN="fm1buddy-pcbfun-s3-28.bin"'
    ; USB MIDI on a computer: its name, and its ports' (the computer's input, and output)
    '-D FM1BUDDY_USB_NAME="FMBuddy"'
    '-D FM1BUDDY_USB_IN="FMBuddy_IN"'
    '-D FM1BUDDY_USB_OUT="FMBuddy_OUT"'
    ; Bluetooth MIDI: one two-way connection (no in and out ports), named apart from USB's
    '-D FM1BUDDY_BLE_NAME="FMBuddy BLE"'
    ; the panel: as cyd-s3, verified on this board's glass (2026-11-12)
    -D ILI9341_2_DRIVER=1
    -D TFT_RGB_ORDER=TFT_BGR
    -D TFT_INVERSION_ON=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320

[env:cyd-s3-4]
extends = s3-tft
build_flags =
    ${s3-tft.build_flags}
    '-D FM1BUDDY_BIN="fm1buddy-cyd-s3-4.bin"'
    ; the 4" (FNK0104S): ST7796, 480x320
    -D ST7796_DRIVER=1
    -D TFT_RGB_ORDER=TFT_BGR
    -D TFT_INVERSION_ON=1
    -D TFT_WIDTH=320
    -D TFT_HEIGHT=480
    -D SCREEN_W=480
    -D SCREEN_H=320

; the 3.5" (FNK0104N) is a different board: an ST77922 panel on QSPI (four data lines, its own commands) and a touch
; controller inside it, and its own pins for the touch, the SD card, the light and the battery
[env:cyd-s3-35]
extends = s3
build_flags =
    ${s3.build_flags}
    '-D FM1BUDDY_BIN="fm1buddy-cyd-s3-35.bin"'
    -D SCREEN_ST77922=1
    -D SCREEN_W=480
    -D SCREEN_H=320
    ; the panel (ST77922, QSPI: display.cpp), and its light
    -D LCD_CS=10
    -D LCD_SCK=12
    -D LCD_D0=11
    -D LCD_D1=13
    -D LCD_D2=14
    -D LCD_D3=9
    -D TFT_BL=41
    -D TFT_BACKLIGHT_ON=HIGH
    ; the touch panel (part of the ST77922: I2C 0x55)
    -D TOUCH_SDA=38
    -D TOUCH_SCL=39
    -D TOUCH_RST=48
    -D TOUCH_INT=47
    ; the SD card (4-bit SD_MMC)
    -D SD_CLK=5
    -D SD_CMD=4
    -D SD_D0=6
    -D SD_D1=7
    -D SD_D2=2
    -D SD_D3=3
    ; the RGB LED (WS2812), and the battery's divider (hal::batteryMv)
    -D LED_RGB=40
    -D BAT_ADC=8

[env:sim]
platform = https://github.com/platformio/platform-native.git
build_src_filter = +<app/> +<sim/>
build_flags =
    ${app.build_flags}
    -D FM_SIM=1
    -std=gnu++17
    !sdl2-config --cflags --libs
    -lcurl
lib_deps =
    ${app.lib_deps}

[env:sim-4]
extends = env:sim
build_flags =
    ${env:sim.build_flags}
    '-D FM1BUDDY_BIN="fm1buddy-cyd-s3-4.bin"'
    -D SCREEN_W=480
    -D SCREEN_H=320
